name: Release to PyPI

# Publishing is deliberately manual and tag-driven: a package version is
# permanent once it is on PyPI, so it should never happen as a side effect
# of a merge.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: The suite must pass before anything is published
        run: |
          agentaudit corpus verify
          pytest -q
          ruff check .
      - run: pip install build twine
      - run: python -m build
      - name: Check the built metadata renders on PyPI
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: no API token stored in the repo. Configure the
      # publisher once at https://pypi.org/manage/account/publishing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
