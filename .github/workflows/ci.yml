name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Verify shipped corpus matches generator
        run: agentaudit corpus verify
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Benchmark smoke run
        run: agentaudit bench --n 25

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Same seed must give byte-identical results
        run: |
          agentaudit bench --n 50 > a.txt
          agentaudit bench --n 50 > b.txt
          diff a.txt b.txt && echo "reproducible"
